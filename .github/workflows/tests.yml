# Runs the suite on every push and pull request.
#
# Dependabot only opens the pull request for a version bump; this is what checks
# the vault still opens under it before it can be merged.
#
# Windows only, deliberately: it is the platform the app is developed and run
# on, and the only one where restrict_to_owner does real work (icacls and an
# ACL). A Linux job would need the Qt platform libraries installed first.
#
# Tested on the oldest and newest Python that requirements.lock carries hashes
# for, so a bump that drops support for either end fails here.
#
# Actions are pinned to a commit rather than a tag, which can be moved;
# Dependabot keeps the pins current.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The lock files, not the .txt ones: --require-hashes is the check
      # AccountVault_Windows.bat performs on a user's machine, so it is the one
      # CI has to keep working. pip is not upgraded first; that would fetch an
      # unverified copy of the tool about to do the verifying.
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/requirements.lock -r requirements/requirements-dev.lock

      - name: Run tests
        run: python -m pytest tests/ -q
